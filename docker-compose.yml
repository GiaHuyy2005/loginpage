services:
  json-server:
    image: clue/json-server
    volumes:
      - ./db.json:/data/db.json
    command: json-server --host 0.0.0.0 --port 3001 /data/db.json
    ports:
      - "3001:3001"

  nextjs-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://json-server:3001
    depends_on:
      - json-server
